version: '3.8'

services:
  # PostgreSQL Database for Development
  database:
    image: postgres:16-alpine
    container_name: websitehunt-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: websitehunt
      POSTGRES_USER: websitehunt_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - websitehunt-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websitehunt_user -d websitehunt"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for Development
  redis:
    image: redis:7-alpine
    container_name: websitehunt-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass dev_redis_password
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"
    networks:
      - websitehunt-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Website Hunt Development App with Hot Reload
  app-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: websitehunt-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://websitehunt_user:strongpassword@database:5432/websitehunt
      REDIS_URL: redis://:dev_redis_password@redis:6379
      SESSION_SECRET: dev_session_secret_not_for_production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "5000:5000"
      - "5173:5173"  # Vite dev server
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - websitehunt-dev-network
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    stdin_open: true
    tty: true

  # pgAdmin for Database Management (Development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: websitehunt-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@websitehunt.dev
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    depends_on:
      - database
    networks:
      - websitehunt-dev-network
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin

volumes:
  pgdata:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  websitehunt-dev-network:
    driver: bridge