services:
  # PostgreSQL Database for Development
  database:
    image: postgres:16-alpine
    container_name: websitehunt-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: websitehunt
      POSTGRES_USER: websitehunt_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - websitehunt-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U websitehunt_user -d websitehunt"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Website Hunt Development App with Hot Reload
  app-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: websitehunt-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://websitehunt_user:strongpassword@database:5432/websitehunt
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_not_for_production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # No default admin password, matching docker-compose.yml. A known
      # credential baked into a compose file is a real weakness even in dev, so
      # seeding is opt-in here too: set ADMIN_PASSWORD and SEED_DATABASE=true in
      # .env for the first boot.
      SEED_DATABASE: ${SEED_DATABASE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@iiit.ac.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      # One port: Vite runs as Express middleware, not a separate dev server.
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - websitehunt-dev-network
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    stdin_open: true
    tty: true

  # pgAdmin for Database Management (Development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: websitehunt-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@websitehunt.dev
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    depends_on:
      - database
    networks:
      - websitehunt-dev-network
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin

volumes:
  pgdata:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  websitehunt-dev-network:
    driver: bridge