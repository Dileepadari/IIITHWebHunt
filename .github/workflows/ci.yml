name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.9 is the floor: package.json scripts use --env-file-if-exists,
        # which Node added in 22.9.0.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # Fonts and icons must be bundled, not fetched from a CDN. This app is
      # deployed to a campus LAN with no route out, where a CDN import means no
      # icons and no display font. See not_for_you.md.
      - name: No CDN assets in the build
        run: |
          if grep -rl "cdnjs.cloudflare.com\|fonts.googleapis.com" dist/ ; then
            echo "The build references a CDN. Bundle the asset instead."
            exit 1
          fi
          test "$(find dist -name '*.woff2' | wc -l)" -gt 0
          echo "Fonts are bundled and no CDN is referenced."

  smoke:
    name: Migrate, seed and serve
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: websitehunt_user
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: websitehunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://websitehunt_user:ci@localhost:5432/websitehunt
      SESSION_SECRET: ci-only-not-a-real-secret
      PORT: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Push the schema
        run: npm run db:push

      # The seed is the only way an admin account can exist, so a broken seed
      # means a deployment with no way into the admin panel.
      - name: Seed
        env:
          ADMIN_USERNAME: admin
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password
        run: npm run db:seed

      - name: Seeding twice is idempotent
        env:
          ADMIN_USERNAME: admin
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-admin-password
        run: npm run db:seed

      - name: Build and serve
        run: |
          npm run build
          NODE_ENV=production node dist/index.js &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5000/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:5000/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/user)" = "401"
          echo "App serves and the API rejects an unauthenticated request."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit || true
      - name: Fail on high or critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
